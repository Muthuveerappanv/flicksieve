name: Build & Publish macOS Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Python Dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install requests beautifulsoup4 letterboxdpy curl_cffi

      - name: Install Node Dependencies
        run: npm ci

      - name: Build and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # replaced automatically by tauri-action with version in tauri.conf.json
          releaseName: 'FlickSieve v__VERSION__'
          releaseBody: 'FlickSieve v__VERSION__ macOS release'
          releaseDraft: true
          prerelease: false
          args: '--target universal-apple-darwin' # build universal binary compatible with Intel & Apple Silicon Macs
